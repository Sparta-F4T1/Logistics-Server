version: '3.8'

services:
  ############## ELK Stack ###############
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ${ELASTIC_HOST}
    platform: linux/amd64
    ports:
      - "${ELASTIC_PORT}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    env_file:
      - .env

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: ${LOGSTASH_HOST}
    platform: linux/amd64
    ports:
      - "${LOGSTASH_TCP_PORT}:5044"
      - "${LOGSTASH_MONITORING_PORT}:9600"
    volumes:
      - ${LOGSTASH_CONFIG_PATH}:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.1
    container_name: ${KIBANA_HOST}
    platform: linux/amd64
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://${ELASTIC_HOST}:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env

  ############## MySQL ###############
  mysql:
    image: mysql
    container_name: mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    env_file:
      - .env

  ############## service registry ###############
  eureka:
    build: service-registry
    container_name: service-registry
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - zipkin
    env_file:
      - .env

  ############## config server ###############
  config-server:
    build: config-server
    container_name: config-server
    ports:
      - "${CONFIG_PORT}:${CONFIG_PORT}"
    env_file:
      - .env
    depends_on:
      - eureka

  ############## Gateway Service ###############
  gateway:
    build: api-gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - zipkin
      - eureka
      - config-server
    env_file:
      - .env

  ############## Auth Service ###############
  auth:
    build: auth-service
    container_name: auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    depends_on:
      - mysql
      - eureka
      - gateway
      - redis
      - zipkin
      - config-server
    env_file:
      - .env

  ############## User Service ###############
  user:
    build: user-service
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
    depends_on:
      - mysql
      - eureka
      - gateway
      - redis
      - zipkin
    env_file:
      - .env

  ############## Order Service ###############
  order:
    build: order-service
    container_name: order-service
    ports:
      - "${ORDER_PORT}:${ORDER_PORT}"
    depends_on:
      - mysql
      - eureka
      - gateway
      - rabbitmq
      - redis
      - zipkin
    env_file:
      - .env

  ############## Product Service ###############
  product:
    build: product-service
    container_name: product-service
    ports:
      - "${PRODUCT_PORT}:${PRODUCT_PORT}"
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
      - zipkin
      - rabbitmq
      - eureka
      - gateway

  ############## Hub Service ###############
  hub:
    build: hub-service
    container_name: hub-service
    ports:
      - "${HUB_PORT}:${HUB_PORT}"
    depends_on:
      - mysql
      - zipkin
      - rabbitmq
      - eureka
      - gateway
      - redis
    env_file:
      - .env

  ############## Company Service ###############
  company:
    build: company-service
    container_name: company-service
    ports:
      - "${COMPANY_PORT}:${COMPANY_PORT}"
    depends_on:
      - mysql
      - zipkin
      - redis
      - eureka
      - gateway
      - rabbitmq
    env_file:
      - .env

  ############## Delivery Service ###############
  delivery:
    build: delivery-service
    container_name: delivery-service
    ports:
      - "${DELIVERY_PORT}:${DELIVERY_PORT}"
    depends_on:
      - mysql
      - eureka
      - gateway
      - redis
      - zipkin
      - rabbitmq
    env_file:
      - .env

  ############## Driver Service ###############
  driver:
    build: driver-service
    container_name: driver-service
    ports:
      - "${DRIVER_PORT}:${DRIVER_PORT}"
    depends_on:
      - mysql
      - eureka
      - zipkin
      - rabbitmq
    env_file:
      - .env

  ############## Gps Service ###############
  gps:
    build: gps-service
    container_name: gps-service
    ports:
      - "${GPS_PORT}:${GPS_PORT}"
    depends_on:
      - mysql
      - eureka
      - redis
      - rabbitmq
      - zipkin
    env_file:
      - .env

  ############## Ai Service ###############
  ai:
    build: ai-service
    container_name: ai-service
    ports:
      - "${AI_PORT}:${AI_PORT}"
    depends_on:
      - mysql
      - eureka
      - redis
      - zipkin
      - rabbitmq
      - gateway
    env_file:
      - .env

  ############## Notification Service ###############
  notification:
    build: notification-service
    container_name: notification-service
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    depends_on:
      - mysql
      - eureka
      - redis
      - zipkin
      - gateway
      - rabbitmq
    env_file:
      - .env

  ############## Redis ###############
  redis:
    image: redis/redis-stack
    container_name: logistics-redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
      - "8001:8001"
    env_file:
      - .env

  ############## RabbitMQ ###############
  rabbitmq:
    image: rabbitmq:management
    container_name: logistics-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "15672:15672"
    env_file:
      - .env

  ############## zipkin ###############
  zipkin:
    image: openzipkin/zipkin
    container_name: logistics-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT}:${ZIPKIN_PORT}"
    env_file:
      - .env

  ############## Prometheus ###############
  prometheus:
    image: prom/prometheus
    container_name: logistics-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    env_file:
      - .env
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  ############## Grafana ###############
  grafana:
    image: grafana/grafana
    container_name: logistics-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus

  ############## Kafka ###############
  Kafka00Service:
    image: bitnami/kafka:3.7.0
    restart: unless-stopped
    container_name: Kafka00Container
    ports:
      - "19092:9092"
    env_file:
      - .env
    environment:
      - KAFKA_ENABLE_KRAFT=yes # KRaft 모드 활성화
      - KAFKA_CFG_BROKER_ID=0
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID} # 고유 클러스터 ID, 모든 브로커에 동일하게 설정
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@Kafka00Service:9093,1@Kafka01Service:9093,2@Kafka02Service:9093
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:10000
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://Kafka00Service:9092,EXTERNAL://localhost:10001
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

  Kafka01Service:
    image: bitnami/kafka:3.7.0
    restart: unless-stopped
    container_name: Kafka01Container
    ports:
      - "19093:9092"
    env_file:
      - .env
    environment:
      - KAFKA_ENABLE_KRAFT=yes # KRaft 모드 활성화
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID} # 고유 클러스터 ID, 모든 브로커에 동일하게 설정
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@Kafka00Service:9093,1@Kafka01Service:9093,2@Kafka02Service:9093
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:10000
      # 모든 브로커가 달라야 한다.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://Kafka01Service:9092,EXTERNAL://localhost:10002
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

  Kafka02Service:
    image: bitnami/kafka:3.7.0
    restart: unless-stopped
    container_name: Kafka02Container
    ports:
      - "19094:9092"
    env_file:
      - .env
    environment:
      - KAFKA_ENABLE_KRAFT=yes # KRaft 모드 활성화
      - KAFKA_CFG_BROKER_ID=2
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_KRAFT_CLUSTER_ID} # 고유 클러스터 ID, 모든 브로커에 동일하게 설정
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@Kafka00Service:9093,1@Kafka01Service:9093,2@Kafka02Service:9093
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:10000
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://Kafka02Service:9092,EXTERNAL://localhost:10003
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=2
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2

  KafkaWebUiService:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    container_name: KafkaWebUiContainer
    ports:
      - '8085:8085'
    env_file:
      - .env
    environment:
      - SERVER_PORT=8085
      - KAFKA_CLUSTERS_0_NAME=Local-Kraft-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=Kafka00Service:9092,Kafka01Service:9092,Kafka02Service:9092
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED=true
      - KAFKA_CLUSTERS_0_AUDIT_CONSOLEAUDITENABLED=true
    depends_on:
      - Kafka00Service
      - Kafka01Service
      - Kafka02Service