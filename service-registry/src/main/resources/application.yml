server:
  port: ${EUREKA_PORT}
spring:
  application:
    name: service-registry

  # ZipKin
management:
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST}:${ZIPKIN_PORT}/api/v2/spans
  tracing:
    enabled: false
  endpoints:
    web:
      exposure:
        include: prometheus,health

eureka:
  client:
    register-with-eureka: false  # Eureka 서버 자체는 다른 Eureka 서버에 등록하지 않음
    fetch-registry: false  # 다른 Eureka 서버의 레지스트리를 가져오지 않음 (Standalone 모드)
  server:
    wait-time-in-ms-when-sync-empty: 0  # 초기 동기화 대기 시간 (즉시 시작)
    enable-self-preservation: false  # Self-Preservation 모드 비활성화 (레지스트리 유지보다 가용성 우선)